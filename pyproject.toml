[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "dirac-solver"
version = "0.0.1"
authors = [
  { name = "Sebastian Rodriguez Garcia", email = "sebrodriguezg@udistrital.edu.co" },
  { name = "Julian Leonardo Avila Martinez", email = "jlavilam@udistrital.edu.co" },
  { name = "Camilo Andres Huertas Archila", email = "cahuertasa@udistrital.edu.co" }
]
description = "Solucionador numérico de la ecuación de Dirac en 1D, 2D y 3D con núcleo en C++ e interfaz en Python / Numerical solver for the 1D, 2D, and 3D Dirac equation"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"

dependencies = [
	"matplotlib",
	"numpy",
	"h5py"
]

[tool.scikit-build]
cmake.source-dir = "cpp_src"

[project.urls]
Homepage = "https://github.com/Julian-L-Avila-M/Dirac-Equation-Solver/tree/main"
